# Desktop portals on HeroWM (fht-compositor): HeroPortal's open/save dialogs,
# HeroWM's screen sharing, GTK's for the rest. Installed by heroportal; it
# replaces HeroWM's own fht-compositor-portals.conf, adding the FileChooser
# line. Restart the portal after changing it:
#   systemctl --user restart xdg-desktop-portal
[preferred]
default=gtk;
org.freedesktop.impl.portal.FileChooser=hero;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.ScreenCast=fht-compositor;
